# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

variables:
  vmImageName: 'ubuntu-latest'

stages:

- stage: Sandbox_Build
  displayName: 'Sandbox Build Stage'
  #dependsOn: QA_Deployment

  jobs:
  - job: Build
    displayName: 'Sandbox_Build'
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install -g @angular/cli
        npm install
        ng build --configuration=sandbox
      displayName: 'npm install and build'

    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: 'package.json' 
        targetFolder: $(Build.ArtifactStagingDirectory)/distsandbox
      displayName: 'Copy package.json'   

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/dist/dna-behavior'
        artifactName: distsandbox
      displayName: 'Publish distsandbox artifact'

- stage: Deploy_Sandbox
  displayName: 'Sandbox Deployment'
  dependsOn: Sandbox_Build
  condition: succeeded()

  jobs: 
  - deployment: Deploy
    displayName: 'Deploy'
    environment: 'SandboxDiscovery'
    pool:
      vmImage: $(vmImageName)
    
    strategy:
      runOnce:
        deploy:
        
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: 'current'
              artifact: 'distsandbox'
              path: '$(Build.ArtifactStagingDirectory)\\dist'
            displayName: 'Download artifact'

          - task: AzureStaticWebApp@0
            displayName: Sandbox Deployment
            inputs:
              workingDirectory: '$(Build.ArtifactStagingDirectory)\\dist'
              app_location: '/'
              azure_static_web_apps_api_token: '$(Sandbox_Discovery_App_Token)'

- stage: Production_Build
  displayName: 'Production Build Stage'
  #dependsOn: Deploy_Sandbox

  jobs:
  - job: Build
    displayName: 'Production_Build'
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm install -g @angular/cli
        npm install
        ng build --configuration=production
      displayName: 'npm install and build'

    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: 'package.json' 
        targetFolder: $(Build.ArtifactStagingDirectory)/distprod
      displayName: 'Copy package.json'   

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/dist/dna-behavior'
        artifactName: distprod
      displayName: 'Publish distprod artifact'

- stage: Deploy_Production
  displayName: 'Production Deployment'
  dependsOn: Production_Build
  condition: succeeded()

  jobs: 
  - deployment: Deploy
    displayName: 'Deploy'
    environment: 'ProductionDiscovery'
    pool:
      vmImage: $(vmImageName)
    
    strategy:
      runOnce:
        deploy:
        
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: 'current'
              artifact: 'distprod'
              path: '$(Build.ArtifactStagingDirectory)\\dist'
            displayName: 'Download artifact'

          - task: AzureStaticWebApp@0
            displayName: Production Deployment
            inputs:
              workingDirectory: '$(Build.ArtifactStagingDirectory)\\dist'
              app_location: '/'
              azure_static_web_apps_api_token: '$(Production_Discovery_App_Token_New)'